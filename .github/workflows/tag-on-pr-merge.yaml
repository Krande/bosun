name: Create Tag on PR Merge

# On a merged PR, deputy reads the release-* label and, when a release is
# warranted, runs python-semantic-release to bump the version, create a vX.Y.Z
# tag, push it, and cut a GitHub Release. The release config comes from deputy's
# built-in semantic-release defaults plus the [release] table in deputy.toml
# (which keeps pyproject's version and src/bosun/__init__.py's __version__ in
# lockstep).
#
# CRITICAL — the release commit + tag are pushed over SSH with the SOURCE_KEY
# deploy key, NOT the default GITHUB_TOKEN. semantic-release pushes a version-bump
# commit to main, and GITHUB_TOKEN cannot push to a protected branch (GH006:
# "Changes must be made through a pull request"); a deploy key can — as long as
# branch protection does NOT enable "Do not allow bypassing the above settings".
#
# Requires: secrets.SOURCE_KEY — a deploy key with WRITE access to this repo.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  tag:
    name: Tag release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history; deploy-key auth so the release push bypasses branch protection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # base branch (main) — the merge is already in
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release@users.noreply.github.com"

      - name: Install deputy
        run: pip install "deputy @ git+https://github.com/Krande/deputy@v0.5.6"

      - name: Tag + release per the PR's release label
        run: deputy tag-on-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
